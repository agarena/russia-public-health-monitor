# 来源注册表：本站采集的全部公开来源。
# 采集方式（collect.method）：
#   google_news_rss —— 经 Google News RSS 中转的关键词监控（relay，条目会标注原始出版方；
#                      用于无公开 RSS 的媒体，如 Reuters/AP/CNN 等付费墙媒体）
#   rss             —— 出版方自己的公开 RSS/Atom 订阅
# 合规红线：只用公开 RSS 与公开网页，不绕过登录、验证码、付费墙或平台访问限制。
sources:
  # ── S 级：官方 / 专业原始资料 ─────────────────────────────
  - id: src-who
    name: WHO
    name_zh: 世界卫生组织
    type: official
    tier: S
    language: en
    country_or_region: 全球
    official: true
    url: https://www.who.int
    description_zh: 联合国卫生机构；声明、疫情暴发新闻（DON）与记者会口径。
    enabled: true
    collect:
      method: google_news_rss
      query: "site:who.int (Russia OR Siberia) (plague OR pneumonia)"
      hl: en-US

  - id: src-rospotr
    name: Rospotrebnadzor
    name_zh: 俄联邦消费者权益保护与公益监督局
    type: official
    tier: S
    language: ru
    country_or_region: 俄罗斯
