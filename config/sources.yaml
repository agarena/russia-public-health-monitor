    url: https://www.rospotrebnadzor.ru
    description_zh: 俄罗斯联邦卫生与流行病学监督主管部门，事件的直接主管官方来源。
    enabled: true
    collect:
      method: google_news_rss
      query: "site:rospotrebnadzor.ru (чума OR пневмония OR Иркутск)"
      hl: ru

