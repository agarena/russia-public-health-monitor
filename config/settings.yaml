# 全局设置：评分权重、首页上限、合规禁词。由 processor 读取。
event_id: russia-public-health-2026

# 首页信息密度上限（规格书 §24/§94）
homepage_caps:
  key_changes: 6
  confirmed: 5
  unconfirmed: 5
  unknowns: 5
  next_triggers: 5

# 内部 attention score 权重（0-100，前端不显示数字；规格书 §32）
attention_score_weights:
  transmission_evidence: 35
  geographic_spread: 20
  information_velocity: 15
  severity: 10
  pathogen_relevance: 10
  official_measure_change: 10

# 合规禁词（正则）：命中即阻断。规格书 §7/§95。
# 豁免：signal.is_quotation = true 的条目、title_original（原文归属来源）、name 等归属字段。
# 注意：只扫描数据文件（mock/public-data/history），不扫描前端源码——
# 免责声明/方法论页面包含对禁词的否定性陈述，属于合规内容。
banned_patterns:
  - "爆发概率"
  - "感染概率"
  - "患病概率"
  - "中招概率"
  - "预测准确率"
  - "预测成功"
  - "AI预测"
  - "提前预测"
  - "比官方提前"
  - "预计.{0,8}爆发"
  - "席卷全球"
  - "席卷全国"
  - "疫情失控"
  - "全球灾难"
  - "正在失控"

# 采集设置
collection:
  cron_hint_hours: 2
  timeout_seconds: 30
  # 跨来源并发线程数（单来源每次运行仍只有一两个请求，不提高对单一站点的频率）
  max_workers: 8
  max_items_per_source: 50

# 结构化设置
structuring:
  # 超过 N 天的原始条目不再生成信号提案（历史资料走 history 页人工整理）
  max_item_age_days: 45

# 事件关联关键词（第一层粗筛，命中任意一个即标记 event_relevant）
event_keywords:
  ru:
    - "чума"
    - "чумн"
    - "пневмон"
    - "карантин"
    - "Иркутск"
    - "Шелехов"
    - "противочумн"
    - "Роспотребнадзор"
    - "эпидем"
  en:
    - "plague"
    - "pneumonia"
    - "Irkutsk"
    - "Shelekhov"
    - "quarantine"
    - "Rospotrebnadzor"
    - "Siberia"
    - "anti-plague"

# AI 结构化（OpenAI 兼容）
ai:
  env_base_url: AI_BASE_URL
  env_api_key: AI_API_KEY
  env_model: AI_MODEL
  max_tokens: 2000
